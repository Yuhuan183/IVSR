[workspace]
resolver = "3"
members = [
    "crates/ivsr-core",
    "crates/ivsr-engine-realesrgan",
    "crates/ivsr-filters",
    "crates/ivsr-media",
    "crates/ivsr-update",
    "crates/ivsr-service",
    "crates/ivsr-cli",
    "apps/desktop/src-tauri",
]
default-members = [
    "crates/ivsr-core",
    "crates/ivsr-engine-realesrgan",
    "crates/ivsr-filters",
    "crates/ivsr-media",
    "crates/ivsr-update",
    "crates/ivsr-service",
    "crates/ivsr-cli",
]

[workspace.package]
publish = false
version = "0.2.0-beta.1"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/Yuhuan183/IVSR"

[workspace.dependencies]
ivsr-core = { path = "crates/ivsr-core" }
ivsr-engine-realesrgan = { path = "crates/ivsr-engine-realesrgan" }
ivsr-filters = { path = "crates/ivsr-filters" }
ivsr-media = { path = "crates/ivsr-media" }
ivsr-update = { path = "crates/ivsr-update" }
ivsr-service = { path = "crates/ivsr-service" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
semver = { version = "1", features = ["serde"] }
toml = "0.9"
dirs = "6"
which = "8"
# Release archives and their digests: read by the updater, built by tests.
sha2 = "0.10"
zip = { version = "8", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Pixel loops and image codecs are an order of magnitude slower unoptimised;
# keep `tauri dev` and tests usable when filtering video frames and previews.
[profile.dev.package.ivsr-filters]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.fast_image_resize]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
