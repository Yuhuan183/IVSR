[workspace]
resolver = "3"
members = [
    "crates/ivsr-core",
    "crates/ivsr-engine-realesrgan",
    "crates/ivsr-media",
    "crates/ivsr-update",
    "crates/ivsr-service",
    "crates/ivsr-cli",
    "apps/desktop/src-tauri",
]
default-members = [
    "crates/ivsr-core",
    "crates/ivsr-engine-realesrgan",
    "crates/ivsr-media",
    "crates/ivsr-update",
    "crates/ivsr-service",
    "crates/ivsr-cli",
]

[workspace.package]
publish = false
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/Yuhuan183/IVSR"

[workspace.dependencies]
ivsr-core = { path = "crates/ivsr-core" }
ivsr-engine-realesrgan = { path = "crates/ivsr-engine-realesrgan" }
ivsr-media = { path = "crates/ivsr-media" }
ivsr-update = { path = "crates/ivsr-update" }
ivsr-service = { path = "crates/ivsr-service" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
semver = { version = "1", features = ["serde"] }
toml = "0.9"
dirs = "6"
which = "8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
