[package]
name = "ivsr-cli"
description = "ivsr command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ivsr"
path = "src/main.rs"

[dependencies]
ivsr-core.workspace = true
ivsr-service.workspace = true
ivsr-update.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap = { version = "4.5", features = ["derive", "wrap_help", "env"] }
clap_complete = "4.5"
indicatif = "0.18"
console = "0.16"
ctrlc = "3.4"

[dev-dependencies]
tempfile.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Building and serving release archives in the self-update test.
sha2.workspace = true
zip.workspace = true
flate2.workspace = true
tar.workspace = true
